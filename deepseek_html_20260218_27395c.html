<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            user-select: none;
        }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .calculator {
            width: 100%;
            max-width: 380px;
            background: #1E1E1E;
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .display {
            background: #1a1a1a;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 140px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
        }
        .expression {
            color: #B0B0B0;
            font-size: 18px;
            text-align: right;
            min-height: 28px;
            word-wrap: break-word;
        }
        .result {
            color: white;
            font-size: 48px;
            font-weight: 700;
            text-align: right;
            word-wrap: break-word;
            line-height: 1.2;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            border: none;
            aspect-ratio: 1;
            border-radius: 30px;
            font-size: 28px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
            color: white;
            transition: 0.1s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }
        .number { background: #2D2D2D; }
        .function { background: #333; color: #4CAF50; font-size: 26px; }
        .operator { background: #FF9800; font-size: 32px; }
        .equals { background: #2196F3; font-size: 32px; }
        .zero { grid-column: span 2; aspect-ratio: auto; text-align: left; padding-left: 30px; }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>
        <div class="buttons">
            <button class="function" onclick="c()">C</button>
            <button class="function" onclick="del()">⌫</button>
            <button class="function" onclick="op('%')">%</button>
            <button class="operator" onclick="op('÷')">÷</button>
            
            <button class="number" onclick="num('7')">7</button>
            <button class="number" onclick="num('8')">8</button>
            <button class="number" onclick="num('9')">9</button>
            <button class="operator" onclick="op('×')">×</button>
            
            <button class="number" onclick="num('4')">4</button>
            <button class="number" onclick="num('5')">5</button>
            <button class="number" onclick="num('6')">6</button>
            <button class="operator" onclick="op('-')">−</button>
            
            <button class="number" onclick="num('1')">1</button>
            <button class="number" onclick="num('2')">2</button>
            <button class="number" onclick="num('3')">3</button>
            <button class="operator" onclick="op('+')">+</button>
            
            <button class="number zero" onclick="num('0')">0</button>
            <button class="number" onclick="dot()">.</button>
            <button class="equals" onclick="calc()">=</button>
        </div>
    </div>

    <script>
        let current = '', first = '', second = '', operator = '', reset = false;
        
        function num(n) {
            if(reset) { current = ''; reset = false; }
            if(current.length < 20) {
                current = current === '0' ? n : current + n;
                show();
            }
        }
        
        function dot() {
            if(reset) { current = '0'; reset = false; }
            if(!current.includes('.')) current = current ? current + '.' : '0.';
            show();
        }
        
        function op(o) {
            if(current) {
                if(first && second) calc();
                if(!first) first = current;
                operator = o;
                second = '';
                reset = true;
                document.getElementById('expression').innerText = first + ' ' + operator;
            }
        }
        
        function calc() {
            if(!first || !operator || !current) return;
            second = current;
            let n1 = parseFloat(first), n2 = parseFloat(second), res = 0;
            
            if(operator === '+') res = n1 + n2;
            else if(operator === '-') res = n1 - n2;
            else if(operator === '×') res = n1 * n2;
            else if(operator === '÷') { 
                if(n2 === 0) { document.getElementById('result').innerText = 'Error'; c(); return; }
                res = n1 / n2;
            }
            else if(operator === '%') res = (n1 * n2) / 100;
            
            res = res.toString().length > 20 ? res.toExponential(8) : res.toString();
            document.getElementById('result').innerText = res;
            first = res;
            current = '';
            operator = '';
            document.getElementById('expression').innerText = '';
            reset = true;
        }
        
        function c() { current = ''; first = ''; second = ''; operator = ''; document.getElementById('result').innerText = '0'; document.getElementById('expression').innerText = ''; }
        function del() { if(current) { current = current.slice(0,-1) || '0'; show(); } }
        function show() { document.getElementById('result').innerText = current || '0'; }
    </script>
</body>
</html>
